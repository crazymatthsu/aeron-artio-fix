# slf4j-simple, test runtime only.
# Artio, Aeron, QuickFIX/J and the AMPS client all log at INFO by default and between them drown
# the test output, so the floor is WARN and this project's own loggers are lifted back to INFO.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.com.demo.artio=info
# The bridge's own message log would print every message twice in a suite that already asserts on
# them; leave it off unless a failure needs it.
org.slf4j.simpleLogger.log.com.demo.artio.engine.LoggingSink=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
