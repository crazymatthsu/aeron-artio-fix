# ---------------------------------------------------------------------------
# The bridge's configuration: an Artio FIX engine on one side, AMPS on the
# other. Read by BridgeMain; every key here can be overridden on the command
# line without editing the file, because `run` forwards -Dartio.* and
# -Dbridge.* from the Gradle JVM:
#
#   ./gradlew :artio-amps-bridge:run
#   ./gradlew :artio-amps-bridge:run -Dartio.port=9881
#   ./gradlew :artio-amps-bridge:run -Dbridge.amps.uri=tcp://host:9007/amps/fix
#   ./gradlew :artio-amps-bridge:run --args="--config /path/to/other.properties"
#
# The defaults match the demo in docs/00 section 8: an acceptor on 9880 that a
# QuickFIX/J initiator can log on to, publishing into the AMPS that
# `amps-server/scripts/amps.sh start` gives you.
# ---------------------------------------------------------------------------

# --- the FIX engine -------------------------------------------------------
# acceptor (bind and wait) or initiator (connect out).
artio.mode=acceptor
# Labels thread names, directories and logs. Need not be unique.
artio.name=bridge
# Bind address for an acceptor; remote address for an initiator.
artio.host=0.0.0.0
artio.port=9880
# From this engine's point of view: 49 on what it sends, 56 on what it receives.
artio.senderCompId=ARTIO
artio.targetCompId=QFJ
# FIX.4.2 or FIX.4.4. 4.2 works because :fix-codecs generates the dictionary;
# see docs/02.
artio.fixVersion=FIX.4.2
artio.heartbeatIntervalSec=30

# --- AMPS -----------------------------------------------------------------
# The /amps/fix path is not decoration: it selects the server-side FIX parser,
# which is what makes SOW keys like /11 and content filters over tag numbers
# work. Connect on /amps/json and you get a connection and then silence.
bridge.amps.uri=tcp://localhost:9007/amps/fix
bridge.amps.clientName=artio-bridge
# true installs a client-side publish store, so messages already handed to the
# client are replayed after a reconnect instead of being lost. In memory only -
# it does not survive this process dying. See docs/03.
bridge.amps.guaranteedPublishing=false

# --- topics ---------------------------------------------------------------
# Every application message goes here, unconditionally. No SOW key, so nothing
# can be silently collapsed; journalled, so it is the recovery path for
# anything a rule below declines. Leave blank to publish only what the rules
# match.
bridge.defaultTopic=fix.raw
# Session-level traffic (Logon, Heartbeat, ...) - only when the next key is
# true. Off by default: a heartbeat per session per interval would be the
# largest and least useful stream in the instance.
bridge.adminTopic=fix.admin
bridge.publishAdminMessages=false

# The routing rules, in order, applied after defaultTopic. requiredTag is the
# destination topic's SOW key, and checking it is a CORRECTNESS requirement,
# not a precaution: AMPS accepts a SOW publish that lacks the topic's key and
# silently stores every such message under one shared record, so publishing
# three keyless messages leaves one. See docs/05 section 8.1.
#
# Defining bridge.route[0] replaces this whole set; indices must start at 0 and
# not skip.
bridge.route[0].msgType=D
bridge.route[0].topic=fix.orders
bridge.route[0].requiredTag=11

bridge.route[1].msgType=G
bridge.route[1].topic=fix.orders
bridge.route[1].requiredTag=11

bridge.route[2].msgType=F
bridge.route[2].topic=fix.orders
bridge.route[2].requiredTag=11

bridge.route[3].msgType=8
bridge.route[3].topic=fix.execs
bridge.route[3].requiredTag=17

bridge.route[4].msgType=8
bridge.route[4].topic=fix.order.state
bridge.route[4].requiredTag=37

# --- the hand-off ---------------------------------------------------------
# The off-heap ring buffer between Artio's poll thread and the publisher
# thread. A power of two; 4 MiB is roughly 20 000 FIX messages in flight.
bridge.ringBufferCapacityBytes=4194304
# DROP_AND_COUNT (default) or BLOCK. BLOCK holds the Artio poll thread for up
# to overflowBlockTimeoutMs while the publisher catches up, and drops after
# that; keep the timeout well under the heartbeat interval.
bridge.overflowPolicy=DROP_AND_COUNT
bridge.overflowBlockTimeoutMs=1000
# How long close() waits for AMPS to acknowledge everything, and the logon
# timeout when connecting.
bridge.flushTimeoutMs=10000
# Reconnect back-off after an AMPS disconnect: doubles from the first to the
# ceiling. Messages arriving while disconnected are counted, not queued.
bridge.reconnect.initialBackoffMs=250
bridge.reconnect.maxBackoffMs=30000
# How the publisher thread idles when the ring buffer is empty: BACKOFF,
# BUSY_SPIN or SLEEPING.
bridge.idleStrategy=BACKOFF
