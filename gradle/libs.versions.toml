[versions]
# Artio 0.168 pulls aeron-client/aeron-archive 1.47.4, agrona 2.0.1 and sbe-tool 1.34.1.
# aeron-driver must match aeron-client exactly, hence one shared version.
artio = "0.168"
aeron = "1.47.4"
agrona = "2.0.1"
# AMPS Java client, published to Maven Central by 60East Technologies.
amps = "5.3.5.4"
# QuickFIX/J 3.x needs Java 17+. The per-version messages jars carry FIX42.xml / FIX44.xml.
quickfixj = "3.0.2"
slf4j = "2.0.17"
junit = "5.13.4"
awaitility = "4.3.0"
# Spring Boot for artio-spring-boot only: YAML-bound configuration and lifecycle, no web stack.
springBoot = "3.5.9"

[libraries]
artio-core = { module = "uk.co.real-logic:artio-core", version.ref = "artio" }
artio-codecs = { module = "uk.co.real-logic:artio-codecs", version.ref = "artio" }
artio-session-codecs = { module = "uk.co.real-logic:artio-session-codecs", version.ref = "artio" }
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
aeron-driver = { module = "io.aeron:aeron-driver", version.ref = "aeron" }
aeron-archive = { module = "io.aeron:aeron-archive", version.ref = "aeron" }
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
amps-client = { module = "com.crankuptheamps:amps-client", version.ref = "amps" }
quickfixj-core = { module = "org.quickfixj:quickfixj-core", version.ref = "quickfixj" }
quickfixj-messages-fix42 = { module = "org.quickfixj:quickfixj-messages-fix42", version.ref = "quickfixj" }
quickfixj-messages-fix44 = { module = "org.quickfixj:quickfixj-messages-fix44", version.ref = "quickfixj" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
